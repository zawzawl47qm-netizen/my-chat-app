<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Video Call App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f0f2f5; }
        #chat-container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #messages { list-style-type: none; padding: 0; height: 200px; overflow-y: scroll; border: 1px solid #ddd; margin-bottom: 10px; }
        #messages li { padding: 5px; border-bottom: 1px solid #eee; }
        .video-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
        video { width: 45%; background: black; border-radius: 5px; transform: scaleX(-1); }
        input, button { padding: 8px; margin-top: 5px; }
        #username { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .input-row { display: flex; gap: 5px; }
        #message-input { flex: 1; }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>My Chat & Video Call</h2>

    <!-- Video Call UI -->
    <div class="video-box">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div style="text-align: center; margin-bottom: 10px;">
        <button id="startCall" style="background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Start Call</button>
    </div>

    <!-- Chat UI -->
    <input type="text" id="username" placeholder="Your name...">
    <ul id="messages"></ul>
    <div class="input-row">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-btn" style="background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Send</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const messages = document.getElementById('messages');

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const startCallBtn = document.getElementById('startCall');

    let localStream;
    let peerConnection;

    const servers = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' }
        ]
    };

    // Chat functionality
    sendBtn.onclick = () => {
        const name = usernameInput.value.trim() || 'Anonymous';
        const msg = messageInput.value.trim();
        if (msg) {
            socket.emit('chat message', { name, msg });
            messageInput.value = '';
        }
    };

    socket.on('chat message', (data) => {
        const item = document.createElement('li');
        item.innerHTML = `<strong>${data.name}:</strong> ${data.msg}`;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    });

    // WebRTC Video Call
    startCallBtn.onclick = async () => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;

            startCallBtn.disabled = true;
            startCallBtn.style.background = '#ccc';

            createPeerConnection();

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer);
        } catch (err) {
            console.error('Error accessing media devices.', err);
            alert('Camera/Microphone permission denied or not available.');
        }
    };

    function createPeerConnection() {
        peerConnection = new RTCPeerConnection(servers);

        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('ice-candidate', event.candidate);
            }
        };
    }

    socket.on('offer', async (offer) => {
        if (!localStream) {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
        }

        createPeerConnection();

        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('answer', answer);
    });

    socket.on('answer', async (answer) => {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('ice-candidate', async (candidate) => {
        try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
            console.error('Error adding received ice candidate', e);
        }
    });
</script>
</body>
</html>
