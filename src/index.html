<!DOCTYPE html>
<html lang="my">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat & Video Call App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f0f2f5; }
        #chat-container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #messages { list-style-type: none; padding: 0; height: 200px; overflow-y: scroll; border: 1px solid #ddd; margin-bottom: 10px; padding: 5px; }
        #messages li { padding: 5px; border-bottom: 1px solid #eee; }
        .video-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
        video { width: 45%; background: black; border-radius: 5px; transform: scaleX(-1); }
        input, button { padding: 8px; margin-top: 5px; }
        #username { width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .input-row { display: flex; gap: 5px; }
        #message-input { flex: 1; }
   .call-log-bubble {
    background-color: #f0f2f5;
    border-radius: 12px;
    padding: 10px 15px;
    margin: 5px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 250px;
    font-family: Arial, sans-serif;
}
.call-log-bubble div {
    display: flex;
    flex-direction: column;
}
.call-log-bubble span.title {
    font-weight: bold;
    font-size: 14px;
    color: #000;
}
.call-log-bubble span.time {
    font-size: 12px;
    color: #65676b;
}
    </style>
</head>
<body>

<div id="chat-container">
    <h2>My Chat & Video Call</h2>
    
    <!-- Video Call UI -->
    <div class="video-box">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div style="text-align: center; margin-bottom: 10px;">
        <button id="startCall" style="background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">ဗီဒီယိုခေါ်မည်</button>
    </div>
    <div id="call-controls" style="display: none; margin-top: 10px; text-align: center;">
  <button id="acceptBtn" style="background-color: #28a745; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer;">Accept</button>
  <button id="rejectBtn" style="background-color: #dc3545; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px;">Reject</button>
    </div>
    
    <!-- Chat UI -->
    <input type="text" id="username" placeholder="Your name...">
    <ul id="messages"></ul>
    <div class="input-row">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button id="send-btn" style="background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Send</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    
    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const messages = document.getElementById('messages');
    const startCallBtn = document.getElementById('startCall');
const callControls = document.getElementById('call-controls');
const acceptBtn = document.getElementById('acceptBtn');
const rejectBtn = document.getElementById('rejectBtn');
    
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    
    let localStream;
    let peerConnection;

    const servers = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' }
        ]
    };

    // Chat functionality
    sendBtn.onclick = () => {
        const name = usernameInput.value.trim() || 'Anonymous';
        const msg = messageInput.value.trim();
        if (msg) {
            socket.emit('chat message', { name, msg });
            messageInput.value = '';    
    };

    socket.on('chat message', (data) => {
        const item = document.createElement('li');
        item.textContent = `${data.name}: ${data.msg}`;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    });

    // Video Call functionality
    async function startCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
        } catch (error) {
            alert('ကင်မရာ သို့မဟုတ် မိုက်ခရိုဖုန်း အသုံးပြုခွင့် ငြင်းပယ်ခံရပါသည် (သို့) ဖုန်းတွင် မရှိပါ။');
            console.error(error);
        }
    }

    startCamera();

    startCallBtn.onclick = async () => {
        startCallBtn.disabled = true;
        peerConnection = new RTCPeerConnection(servers);

        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        peerConnection.ontrack = (event) => {
            remoteVideo.srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('ice-candidate', event.candidate);
            }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('offer', offer);
        const callMsg = `<div class="call-log-bubble"><span style="font-size: 20px;">📹</span><div><span class="title">Video call</span><span class="time">Just now</span></div></div>`;
socket.emit('chat message', { name: usernameInput.value || 'System', msg: callMsg });
        
    };

    let incomingOffer = null;

socket.on('offer', async (offer) => {
    incomingOffer = offer;
    callControls.style.display = 'block';
});

acceptBtn.onclick = async () => {
    callControls.style.display = 'none';
    peerConnection = new RTCPeerConnection(servers);
    
    localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
    });

    peerConnection.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
    };

    peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
            socket.emit('ice-candidate', event.candidate);
        }
    };

    await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('answer', answer);
};

rejectBtn.onclick = () => {
    callControls.style.display = 'none';
    incomingOffer = null;
    socket.emit('reject-call');
};
    
    });

    socket.on('ice-candidate', async (candidate) => {
        try {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            }
        } catch (e) {
            console.error('Error adding received ice candidate', e);
        }
    });
</script>

</body>
</html>
