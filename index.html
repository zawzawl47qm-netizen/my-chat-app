<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="appTitleText">My Chat App</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #075e54; color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 70%; padding: 10px; border-radius: 8px; word-break: break-word; }
    .message.incoming { background: white; align-self: flex-start; }
    .message.outgoing { background: #dcf8c6; align-self: flex-end; }
    .chat-footer { padding: 10px; background: white; display: flex; align-items: center; gap: 10px; }
    .chat-footer input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .btn { background: #075e54; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
    
    /* စတေကာဘောက်စ် ဒီဇိုင်း */
    .sticker-container { display: flex; gap: 15px; padding: 5px 15px; background: #fff; border-top: 1px solid #eee; }
    .sticker-item { font-size: 28px; cursor: pointer; transition: transform 0.2s; }
    .sticker-item:hover { transform: scale(1.2); }

    /* ဖုန်းခေါ်ဆိုသည့် စခရင် ဒီဇိုင်း */
    #callScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; color: white; }
    .video-container { display: flex; gap: 10px; margin-bottom: 20px; }
    video { width: 140px; height: 180px; background: #333; border-radius: 10px; object-fit: cover; }
    .call-actions { display: flex; gap: 20px; }
    .call-btn { padding: 12px 20px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; color: white; }
    .accept-btn { background: #28a745; display: none; }
    .end-btn { background: #dc3545; }
    .mute-btn { background: #ffc107; color: black; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div id="headerAvatar">My Chat App</div>
    <div>
      <button onclick="initiateCall('audio')" class="btn" style="padding: 5px 10px;">📞 ခေါ်မည်</button>
      <button onclick="initiateCall('video')" class="btn" style="padding: 5px 10px;">📹 ဗီဒီယိုကော</button>
    </div>
  </div>

  <!-- Chat Messages Area -->
  <div class="chat-body" id="chatBody">
    <div class="message incoming">မင်္ဂလာပါရှင့်။ စတေကာပုံလေးများနဲ့ ဖုန်းခေါ်ဆိုမှုများ ပြုလုပ်နိုင်ပါပြီ။</div>
  </div>

  <!-- မျက်နှာပြောင်တဲ့ စတေကာအရုပ်လေးများ -->
  <div class="sticker-container">
    <span class="sticker-item" onclick="sendSticker('😜')">😜</span>
    <span class="sticker-item" onclick="sendSticker('🤪')">🤪</span>
    <span class="sticker-item" onclick="sendSticker('😂')">😂</span>
    <span class="sticker-item" onclick="sendSticker('😎')">😎</span>
    <span class="sticker-item" onclick="sendSticker('👻')">👻</span>
    <span class="sticker-item" onclick="sendSticker('🥳')">🥳</span>
  </div>

  <!-- Chat Footer (Input & Send) -->
  <div class="chat-footer">
    <input type="text" id="messageInput" placeholder="စာရိုက်ရန်..." onkeypress="handlePress(event)">
    <button class="btn" onclick="sendMessage()">ပို့မည်</button>
  </div>

  <!-- ဖုန်းခေါ်ဆိုသည့် စခရင် (Call Screen UI) -->
  <div id="callScreen">
    <h2 id="callStatusText">ဖုန်းခေါ်ဆိုနေသည်...</h2>
    <div class="video-container">
      <video id="localVideo" autoplay playsinline muted></video>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="call-actions">
      <button class="call-btn accept-btn" id="acceptBtn" onclick="acceptCall()">ကိုင်မည်</button>
      <button class="call-btn mute-btn" onclick="toggleMute()">မိုက် အပိတ်/အဖွင့်</button>
      <button class="call-btn end-btn" onclick="endCall()">ဖုန်းချမည်</button>
    </div>
  </div>

  <!-- Socket.io နှင့် JavaScript ကုဒ်များ -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chatBody = document.getElementById('chatBody');
    const callScreen = document.getElementById('callScreen');
    const callStatusText = document.getElementById('callStatusText');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const acceptBtn = document.getElementById('acceptBtn');
    let localStream;
    let remoteStream;
    let peerConnection;
    let isMuted = false;

    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function sendMessage() {
      const input = document.getElementById('messageInput');
      if (input.value.trim() !== "") {
        appendMessage(input.value, 'outgoing');
        socket.emit('chat-message', { type: 'text', content: input.value });
        input.value = "";
      }
    }

    // စတေကာပို့ခြင်း
    function sendSticker(stickerEmoji) {
      appendMessage(stickerEmoji, 'outgoing');
      socket.emit('chat-message', { type: 'text', content: stickerEmoji });
    }

    async function initiateCall(type) {
      callScreen.style.display = 'flex';
      callStatusText.innerText = 'ခေါ်ဆိုနေသည်...';
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
        localVideo.srcObject = localStream;
        createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call-user', { offer, type });
      } catch (error) {
        alert("ကင်မရာ သို့မဟုတ် မိုက်ခရိုဖုန်း ခွင့်ပြုချက် လိုအပ်ပါသည်။");
        endCall();
      }
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(servers);
      peerConnection.ontrack = (event) => {
        remoteStream = event.streams[0];
        remoteVideo.srcObject = remoteStream;
      };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) socket.emit('ice-candidate', event.candidate);
      };
    }

    socket.on('incoming-call', async (data) => {
      callScreen.style.display = 'flex';
      callStatusText.innerText = 'ဖုန်းဝင်လာပြီ...';
      acceptBtn.style.display = 'block';
      window.incomingOffer = data.offer;
    });

    async function acceptCall() {
      acceptBtn.style.display = 'none';
      callStatusText.innerText = 'ပြောဆိုနေစဉ်...';
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        await peerConnection.setRemoteDescription(new RTCSessionDescription(window.incomingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('answer-call', answer);
      } catch (error) { console.error(error); }
    }

    socket.on('call-answered', async (answer) => {
      callStatusText.innerText = 'ပြောဆိုနေစဉ်...';
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });

    socket.on('ice-candidate', async (candidate) => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    });

    function toggleMute() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          isMuted = !isMuted;
          audioTrack.enabled = !isMuted;
          alert(isMuted ? "မိုက် ပိတ်လိုက်ပါပြီ" : "မိုက် ဖွင့်လိုက်ပါပြီ");
        }
      }
    }

    function endCall() {
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      if (peerConnection) peerConnection.close();
      callScreen.style.display = 'none';
      acceptBtn.style.display = 'none';
      socket.emit('end-call');
      location.reload();
    }

    socket.on('call-ended', () => { endCall(); });

    socket.on('chat-message', (data) => {
      appendMessage(data.content, 'incoming');
    });

    function appendMessage(text, className) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', className);
      msgDiv.innerText = text;
      chatBody.appendChild(msgDiv);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function handlePress(e) { if (e.key === 'Enter') sendMessage(); }
  </script>
</body>
</html>
